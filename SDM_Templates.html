<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDM Email Templates</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+CiAgPHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNiIgZmlsbD0iIzAwNzdjNSIvPgogIDx0ZXh0IHg9IjE2IiB5PSIyMiIgZm9udC1mYW1pbHk9IkFyaWFsLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTMiIGZvbnQtd2VpZ2h0PSJib2xkIiBmaWxsPSJ3aGl0ZSIgdGV4dC1hbmNob3I9Im1pZGRsZSI+U0RNPC90ZXh0Pgo8L3N2Zz4=">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3350;
    --accent: #2563eb;
    --accent2: #3b82f6;
    --text: #e2e8f0;
    --text-muted: #64748b;
    --text-dim: #94a3b8;
    --green: #10b981;
    --yellow: #f59e0b;
    --red: #ef4444;
    --intuit-blue: #0077c5;
  }

  :root.light {
    --bg: #f1f5f9;
    --surface: #ffffff;
    --surface2: #f8fafc;
    --border: #e2e8f0;
    --accent: #2563eb;
    --accent2: #3b82f6;
    --text: #0f172a;
    --text-muted: #94a3b8;
    --text-dim: #475569;
    --green: #059669;
    --yellow: #d97706;
    --red: #dc2626;
    --intuit-blue: #0077c5;
  }

  .theme-toggle {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--text); }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    font-weight: 600;
    color: var(--accent2);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .header-divider { flex: 1; }

  .name-field {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    color: var(--text-dim);
  }

  .name-field input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 15px;
    width: 180px;
    outline: none;
    transition: border-color 0.15s;
  }

  .name-field input:focus { border-color: var(--accent); }
  .name-field input::placeholder { color: var(--text-muted); }

  .main {
    display: grid;
    grid-template-columns: 320px 1fr;
    flex: 1;
    min-height: 0;
  }

  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 20px 0;
    overflow-y: auto;
  }

  .sidebar-section {
    padding: 0 16px;
    margin-bottom: 24px;
  }

  .sidebar-label {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
    padding: 0 4px;
  }

  .inbox-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 8px 10px;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    cursor: pointer;
    margin-bottom: 2px;
    transition: all 0.15s;
  }

  .inbox-btn:hover { background: var(--surface2); color: var(--text); border-color: var(--border); }
  .inbox-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .template-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 9px 10px;
    color: var(--text-dim);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 16px;
    cursor: pointer;
    margin-bottom: 2px;
    transition: all 0.15s;
    line-height: 1.3;
  }

  .template-btn:hover { background: var(--surface2); color: var(--text); border-color: var(--border); }
  .template-btn.active { background: var(--surface2); color: var(--text); border-color: var(--accent); }

  .template-tag {
    display: inline-block;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 1px 5px;
    border-radius: 3px;
    margin-left: 4px;
    vertical-align: middle;
  }

  .tag-pre { background: #f59e0b22; color: var(--yellow); }
  .tag-post { background: #10b98122; color: var(--green); }
  .tag-receipt { background: #3b82f622; color: var(--accent2); }
  .tag-link { background: #8b5cf622; color: #a78bfa; }


  .filter-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    padding: 0 16px 12px;
  }

  .chip {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    color: var(--text-dim);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .toggle-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 4px;
    cursor: pointer;
    font-size: 15px;
    color: var(--text-dim);
    border-radius: 5px;
    transition: color 0.15s;
  }
  .toggle-row:hover { color: var(--text); }
  #sharedDocsMode { display: none; }
  #sharedDocsMode.visible { display: flex !important; }
  .toggle-row input[type="radio"] {
    width: 14px; height: 14px;
    accent-color: var(--accent);
    cursor: pointer; flex-shrink: 0;
  }
  .toggle-row input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }

  .lang-toggle {
    display: flex;
    gap: 4px;
    padding: 0 16px;
    margin-bottom: 20px;
  }

  .lang-btn {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }

  .lang-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .content {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .content-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0;
    display: flex;
    flex-direction: column;
  }

  .content-header-top {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
  }

  .content-header-fields {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 24px;
    background: #1a2540;
    border-bottom: 2px solid var(--accent);
  }

  .template-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    flex: 1;
  }

  .template-meta {
    font-size: 15px;
    color: var(--text-muted);
    font-family: 'IBM Plex Mono', monospace;
  }

  .copy-btn {
    background: var(--accent);
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    color: #fff;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .copy-btn:hover { background: #1d4ed8; }
  .copy-btn.copied { background: var(--green); }

  .add-pair-btn {
    background: none;
    border: 1px dashed var(--border);
    border-radius: 6px;
    padding: 5px 12px;
    color: var(--text-muted);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    width: fit-content;
  }
  .add-pair-btn:hover { border-color: var(--accent); color: var(--accent); }

  .pair-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pair-row .var-field { flex: 1; }
  .remove-pair-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 16px;
    padding: 0 4px;
    transition: color 0.15s;
  }
  .remove-pair-btn:hover { color: var(--red); }

  .clear-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    color: var(--text-muted);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .clear-btn:hover { border-color: var(--red); color: var(--red); }
  .copy-btn.copied { background: var(--green); }

  .variables-bar {
    background: #1a2540;
    border-bottom: 2px solid var(--accent);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .var-field {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    flex: 1;
  }

  .var-field label {
    color: var(--accent2);
    white-space: nowrap;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .var-field input {
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: 5px;
    padding: 8px 12px;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    flex: 1;
    box-shadow: 0 0 0 2px rgba(37,99,235,0.15);
  }

  .var-field input:focus { border-color: var(--accent2); box-shadow: 0 0 0 3px rgba(59,130,246,0.25); }
  .var-field input::placeholder { color: var(--text-muted); font-style: italic; }

  .preview-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    background: var(--bg);
  }

  .email-preview {
    background: #fff;
    color: #1a1a1a;
    border-radius: 8px;
    padding: 32px 36px;
    max-width: 760px;
    margin: 0 auto;
    font-family: Calibri, 'Segoe UI', sans-serif;
    font-size: 16px;
    line-height: 1.6;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  }

  .email-preview p { margin-bottom: 12px; }
  .email-preview p:last-child { margin-bottom: 0; }
  .email-preview b, .email-preview strong { font-weight: 700; }
  .email-preview i, .email-preview em { font-style: italic; }

  .email-preview ul, .email-preview ol {
    margin: 8px 0 12px 24px;
  }

  .email-preview li { margin-bottom: 4px; }

  .email-preview a { color: var(--intuit-blue); }

  .email-preview h4 {
    font-size: 16px;
    font-weight: 700;
    margin: 16px 0 6px;
  }

  .sig-divider {
    border: none;
    border-top: 1px solid #e0e0e0;
    margin: 20px 0 16px;
  }

  .sig-block {
    font-size: 15px;
    line-height: 1.7;
    color: #333;
  }

  .sig-name { font-weight: 700; font-size: 15px; }
  .sig-title { font-weight: 700; }
  .sig-company { font-weight: 700; }
  .sig-brand { font-weight: 700; font-style: italic; }

  .sig-footer {
    margin-top: 16px;
    font-size: 13px;
    color: #666;
    line-height: 1.5;
    border-top: 1px solid #e8e8e8;
    padding-top: 10px;
  }

  .highlight { background: #fff3cd; padding: 0 2px; border-radius: 2px; }

  .placeholder-empty { color: #cc0000; font-style: italic; }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-muted);
    gap: 12px;
    font-size: 16px;
  }

  .empty-icon { font-size: 48px; opacity: 0.3; }

  .inbox-required {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-muted);
    gap: 12px;
    font-size: 16px;
    text-align: center;
    padding: 40px;
  }

  .inbox-required .arrow { font-size: 32px; opacity: 0.4; }
</style>
</head>
<body>

<header>
  <div class="logo">SDM Templates</div>
  <div class="header-divider"></div>
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">☀ Light</button>
</header>

<div class="main">
  <div class="sidebar">
    <div class="lang-toggle">
      <button class="lang-btn active" onclick="setLang('en', this)">EN</button>
      <button class="lang-btn" onclick="setLang('fr', this)">FR</button>
    </div>

    <div class="sidebar-section" id="frSpeakerSection" style="display:none">
      <div class="sidebar-label">Sender</div>
      <label class="toggle-row">
        <input type="checkbox" id="frSpeaker" onchange="renderPreview()">
        <span>French speaker</span>
      </label>
    </div>

    <div class="sidebar-section" id="frSpeakerSection" style="display:none">
      <div class="sidebar-label">Sender</div>
      <label class="toggle-row">
        <input type="checkbox" id="frSpeaker" onchange="renderPreview()">
        <span>French speaker</span>
      </label>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Options</div>
      <label class="toggle-row">
        <input type="checkbox" id="highVolume" onchange="renderPreview()">
        <span>High volume delay</span>
      </label>
      <label class="toggle-row">
        <input type="checkbox" id="sharedDocs" onchange="renderPreview()">
        <span>Shared Documents</span>
      </label>
      <div id="sharedDocsMode" style="display:none; padding: 4px 4px 0 28px; gap:6px; flex-direction:column">
        <label class="toggle-row" style="font-size:13px">
          <input type="radio" name="sdMode" id="sdReplace" value="replace" onchange="renderPreview()" checked>
          <span>Replace upload link</span>
        </label>
        <label class="toggle-row" style="font-size:13px">
          <input type="radio" name="sdMode" id="sdAlternative" value="alternative" onchange="renderPreview()">
          <span>Offer as alternative</span>
        </label>
      </div>
    </div>

    <div class="filter-chips">
      <button class="chip active" onclick="setFilter('all', this)">All</button>
      <button class="chip" onclick="setFilter('receipt', this)">Receipt</button>
      <button class="chip" onclick="setFilter('pre', this)">Pre</button>
      <button class="chip" onclick="setFilter('post', this)">Post</button>
      <button class="chip" onclick="setFilter('link', this)">Link</button>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Templates</div>
      <button class="template-btn" onclick="setTemplate('receipt_qbdt', this)" data-group="receipt">
        Receipt — QBDT <span class="template-tag tag-receipt">Receipt</span>
      </button>
      <button class="template-btn" onclick="setTemplate('receipt_file', this)" data-group="receipt">
        Receipt — File <span class="template-tag tag-receipt">Receipt</span>
      </button>
      <button class="template-btn" onclick="setTemplate('receipt_xero', this)" data-group="receipt">
        Receipt — Xero <span class="template-tag tag-receipt">Receipt</span>
      </button>
      <button class="template-btn" onclick="setTemplate('qbd_pre', this)" data-group="pre">
        Pre-Migration — QBDT <span class="template-tag tag-pre">Pre</span>
      </button>
      <button class="template-btn" onclick="setTemplate('sage_pre', this)" data-group="pre">
        Pre-Migration — Sage <span class="template-tag tag-pre">Pre</span>
      </button>
      <button class="template-btn" onclick="setTemplate('xero_pre', this)" data-group="pre">
        Pre-Migration — Xero <span class="template-tag tag-pre">Pre</span>
      </button>
      <button class="template-btn" onclick="setTemplate('acomba_pre', this)" data-group="pre">
        Pre-Migration — Acomba <span class="template-tag tag-pre">Pre</span>
      </button>
      <button class="template-btn" onclick="setTemplate('qbd_post', this)" data-group="post">
        Post-Migration — QBDT <span class="template-tag tag-post">Post</span>
      </button>
      <button class="template-btn" onclick="setTemplate('sage_post', this)" data-group="post">
        Post-Migration — Sage <span class="template-tag tag-post">Post</span>
      </button>
      <button class="template-btn" onclick="setTemplate('xero_post', this)" data-group="post">
        Post-Migration — Xero <span class="template-tag tag-post">Post</span>
      </button>
      <button class="template-btn" onclick="setTemplate('acomba_post', this)" data-group="post">
        Post-Migration — Acomba <span class="template-tag tag-post">Post</span>
      </button>
      <button class="template-btn" onclick="setTemplate('link_nobox', this)" data-group="link">
        Link — No Box <span class="template-tag tag-link">Link</span>
      </button>
      <button class="template-btn" onclick="setTemplate('link_named', this)" data-group="link">
        Link — Named Email <span class="template-tag tag-link">Link</span>
      </button>
      <button class="template-btn" onclick="setTemplate('link_your', this)" data-group="link">
        Link — Your Email <span class="template-tag tag-link">Link</span>
      </button>
      <button class="template-btn" onclick="setTemplate('link_exp_named', this)" data-group="link">
        Link Expired — Named Email <span class="template-tag tag-link">Link</span>
      </button>
      <button class="template-btn" onclick="setTemplate('link_exp_your', this)" data-group="link">
        Link Expired — Your Email <span class="template-tag tag-link">Link</span>
      </button>
    </div>

    <div class="sidebar-section" id="inboxSection" style="display:none">
      <div class="sidebar-label">Sending From</div>
      <button class="inbox-btn" onclick="setInbox('national', this)">National Accounts CA</button>
      <button class="inbox-btn" onclick="setInbox('pdm', this)">PDM_Migrations</button>
      <button class="inbox-btn" onclick="setInbox('digital', this)">SDM_Digital</button>
      <button class="inbox-btn" onclick="setInbox('diwm', this)">SDM_DIWM</button>
      <button class="inbox-btn" onclick="setInbox('key', this)">SDM_Key</button>
      <button class="inbox-btn" onclick="setInbox('pdc', this)">SDM_PDC</button>
      <button class="inbox-btn" onclick="setInbox('pdcbl', this)">SDM_PDCBL</button>
      <button class="inbox-btn" onclick="setInbox('qc', this)">SDM_QC</button>
    </div>
    </div>

  <div class="content">
    <div id="contentHeader" class="content-header" style="display:none">
      <div class="content-header-top">
        <div class="template-title" id="templateTitle"></div>
        <button class="copy-btn" id="copyBtn" onclick="copyTemplate()">
          <span>⧉</span> Copy
        </button>
      </div>
      <div class="content-header-fields" id="fieldsRow" style="display:none">
        <div id="singleLinkField" style="display:none; align-items:center; gap:12px; flex:1">
          <div class="var-field">
            <label>Upload Link:</label>
            <input type="text" id="uploadLink" placeholder="Paste secure upload link here" oninput="renderPreview()">
          </div>
          <div class="var-field" id="singleEmailField" style="display:none">
            <label>Client Email:</label>
            <input type="text" id="clientEmail" placeholder="client@example.com" oninput="renderPreview()">
          </div>
        </div>
        <div id="multiLinkField" style="display:none; flex-direction:column; gap:6px; flex:1">
          <div id="pairsContainer"></div>
          <button class="add-pair-btn" id="addPairBtn" onclick="addPair()">+ Add another</button>
        </div>
        <div id="clientEmailOnlyField" style="display:none; align-items:center; gap:12px; flex:1">
          <div class="var-field">
            <label>Client Email:</label>
            <input type="text" id="clientEmailOnly" placeholder="client@example.com" oninput="renderPreview()">
          </div>
        </div>
        <button class="clear-btn" id="clearBtn" onclick="clearFields(); renderPreview()">✕ Clear</button>
      </div>
    </div>

    <div id="variablesBar" style="display:none"></div>

    <div class="preview-wrap" id="previewWrap">
      <div class="inbox-required">
        <div class="arrow">←</div>
        <div>Select your sending inbox first, then choose a template.</div>
      </div>
    </div>
  </div>
</div>

<div id="copySource" style="position:absolute;left:-9999px;top:-9999px"></div>

<script>
  const INBOXES = {

  function getUploadSection(uploadLink, sdMode, lang, pairs, clientEmail, extraNote) {
    const isEn = lang === 'en';
    const sdUrl = 'https://quickbooks.intuit.com/learn-support/en-ca/help-article/bookkeeping-processes/using-shared-documents-quickbooks-online/L2VkU6hGi_CA_en_CA';

    const emailNote = clientEmail
      ? (isEn
          ? ` — only <strong style="color:#0077c5">${clientEmail}</strong> can use this link`
          : ` — seul <strong style="color:#0077c5">${clientEmail}</strong> peut utiliser ce lien`)
      : '';

    const linkLine = isEn
      ? `<p>Upload your backup file to this secure upload link${emailNote}: ${uploadLink}</p>`
      : `<p>Téléversez votre fichier de sauvegarde via ce lien sécurisé${emailNote} : ${uploadLink}</p>`;

    const linkBullets = isEn
      ? `<ul>
            <li><strong>Login Required:</strong> You must log in to <strong>QuickBooks Online (QBO)</strong> using the email address where you received the link. If that address is not registered with QuickBooks, please send me the email address you use to log in to QBO.</li>
            <li><strong>Link Expiration:</strong> The link is valid for <strong>15 days or 10 clicks</strong>, whichever comes first.</li>
          </ul>`
      : `<ul>

            <li><strong>Expiration du lien :</strong> Le lien est valable pendant <strong>15 jours ou 10 clics</strong>, selon la première éventualité.</li>
          </ul>`;

    const sdSteps = isEn
      ? `<ol>
            <li>Go to <strong>All Apps</strong>, select <strong>Clients</strong>, then select <strong>Client List</strong>.</li>
            <li>Select the client name.</li>
            <li>Select the <strong>Shared Documents</strong> tab and upload your backup file directly.</li>

      : `<ol>
            <li>Allez dans <strong>Toutes les applications</strong>, sélectionnez <strong>Clients</strong>, puis <strong>Liste des clients</strong>.</li>
            <li>Sélectionnez le nom du client.</li>
            <li>Sélectionnez l&#39;onglet <strong>Documents partagés</strong> et téléversez votre fichier de sauvegarde directement.</li>
          </ol>
          <p>Instructions complètes : <a href="${sdUrl}">Utilisation des documents partagés dans QuickBooks en ligne</a></p>`;

    // Replace mode: shared docs only, no link content, no bullets
    if (sdMode === 'replace') {
      return isEn
        ? `<p>Upload your backup file using the Shared Documents feature in QuickBooks Online. To upload:</p>${sdSteps}`
        : `<p>Téléversez votre fichier de sauvegarde via la fonctionnalité Documents partagés dans QuickBooks en ligne. Pour téléverser :</p>${sdSteps}`;
    }

    // Alternative mode: link + bullets CLOSE the li, then shared docs outside the ol, then notify
    // Returns the link content only — the closing </li> and shared docs go after in template
    if (sdMode === 'alternative') {
      const altIntro = isEn
        ? `<p>Alternatively, you may also upload your backup file using the Shared Documents feature in QuickBooks Online. To upload:</p>`
        : `<p>Vous pouvez également téléverser votre fichier de sauvegarde via la fonctionnalité Documents partagés dans QuickBooks en ligne. Pour téléverser :</p>`;
      const notify = isEn
        ? `<p>Please let me know by email once the upload is complete and which method you chose.</p>`
        : `<p>Veuillez m&#39;aviser par courriel une fois le téléversement effectué et quelle méthode vous avez utilisée.</p>`;
      // Return link line + bullets + close li + shared docs block outside ol (indented to match list) + open next li
      const noteHtmlAlt = extraNote ? `<p>${extraNote}</p>` : '';
      return linkLine + noteHtmlAlt + linkBullets + `</li></ol><div style="margin-left:30px">${altIntro}<div style="margin-left:30px">${sdSteps}</div>${notify}</div><ol start="2">`;
    }

    // Default: link only
    const notify = isEn
      ? `<p>Please let me know by email once the upload is complete.</p>`
      : `<p>Veuillez m&#39;aviser par courriel une fois le téléversement effectué.</p>`;
    return linkLine + linkBullets + notify;
  }

    // ── PRE-MIGRATION ────────────────────────────────────────────────────────
    qbd_pre: {
      title: 'Pre-Migration — QBDT',
      en: (inbox, uploadLink, hv, frSpk, clientEmail, sdMode, pairs, rawEmail, inboxKey) => `<p>I would be happy to migrate your client data for you. Please see our process and limitations below.</p>
        <p>Please reply to this email to let me know when the requirements below have been completed, or if you have any questions.</p>
        <h4>TIMELINE</h4>
        <ul>
          <li>If all goes well, the migration should be completed within 2–3 business days${hv ? '; however, due to an unusually high volume of requests, it may take up to 5 business days' : ''} after all four (4) requirements below have been completed.${hv ? ' We appreciate your patience.' : ''}</li>
          <li>Please allow for a longer delay if the migration needs to be escalated.</li>
        </ul>
        <h4>Requirements (4):</h4>
        <ol>
          <li>Please send us the admin password for the backup.${getUploadSection(uploadLink, sdMode, 'en', pairs, rawEmail, 'Also include the admin username and password (if any). File types accepted: .QBB or .QBW.')}
          </li>
          ${getAccessStep(inboxKey, inbox, 'en')}
          <li>If there is any existing data in QBO, we cannot migrate into that file and will ask you for access to an empty QBO account. Please refrain from entering any new data or connecting bank feeds or third-party apps until you receive my migration completion email — this will help when comparing results.</li>
          <li>Please review the list of limitations for QuickBooks Desktop migrations: <a href="https://quickbooks.intuit.com/learn-support/en-ca/help-article/migrate-data/learn-features-data-move-quickbooks-desktop-online/L0dEyNosU_CA_en_CA?uid=lmrs513q">https://quickbooks.intuit.com/learn-support/en-ca/help-article/migrate-data/learn-features-data-move-quickbooks-desktop-online/L0dEyNosU_CA_en_CA</a></li>
        </ol>
        <h4>Key Limitations:</h4>
        <p><strong>Unbilled Expenses and Time Charges</strong><br>
        All unbilled expenses and time charges will move to QBO. Any attached to inactive customers or employees will reactivate them. These should be bulk-deleted from the Desktop file before migration — not from QBO. If the file has a substantial number of unbilled expenses or time charges, please let us know in advance.</p>
        <p><strong>Budgets</strong><br>
        Only Profit and Loss budget types will migrate to QuickBooks Online.</p>
        <p><strong>Payroll</strong><br>
        Only basic employee information will migrate. The payroll module will need to be set up after migration. Paycheques will be copied as regular cheques.</p>
        <p><strong>Customers and Jobs</strong><br>
        Jobs move to QuickBooks Online as sub-customers. If you track job costing in Desktop, you will need to convert sub-customers to Projects in QBO.</p>
        <p><strong>Multi-Currency</strong><br>
        Transactions with <strong>three or more different currencies</strong> will not migrate to QuickBooks Online.</p>
        <p><strong>Check Your Target Size</strong><br>
        In QuickBooks Desktop, press F2 to open the Product Information window. Your total Target count is shown in the File Information section. It cannot exceed <strong>4 million targets</strong>. If it does, an alternative migration method will need to be considered.</p>
        <p>For a complete list of limitations, please refer to: <a href="https://quickbooks.intuit.com/learn-support/en-ca/help-article/migrate-data/learn-features-data-move-quickbooks-desktop-online/L0dEyNosU_CA_en_CA?uid=lmrs513q">Migrating from QuickBooks Desktop to QuickBooks Online with Intuit's internal tool</a></p>`,

      fr: (inbox, uploadLink, hv, frSpk, clientEmail, sdMode, pairs, rawEmail, inboxKey) => `${frSpk ? `<p>Merci de nous avoir contacté, j'espère que votre journée se passe bien.</p><p>Cela me ferait plaisir de vous assister et de migrer les données de votre client pour vous.</p><p>Vous pouvez sauvegarder ce courriel pour référence future et utiliser le même lien de téléversement pour toutes les futures migrations avec notre équipe.</p>` : ''}
        <p>Veuillez répondre à ce courriel pour m'informer lorsque les exigences ci-dessous auront été remplies ou si vous avez des questions.</p>
        <h4>CHRONOLOGIE</h4>
        <ul>
          <li>Si tout se passe bien, la migration devrait être terminée dans un délai de <strong>2 à 3 jours ouvrables</strong>${hv ? '; cependant, en raison d\'un volume de demandes inhabituellement élevé, cela pourrait prendre jusqu\'à 5 jours ouvrables' : ''} après avoir complété les (4) exigences ci-dessous.${hv ? ' Nous vous remercions de votre patience.' : ''}</li>
          <li>Veuillez prévoir un délai plus long si la migration doit être intensifiée.</li>
        </ul>
        <h4>EXIGENCES (4) :</h4>
        <ol>
          <li>${getUploadSection(uploadLink, sdMode, 'fr', pairs, rawEmail, 'Incluez également le nom d&#39;utilisateur et le mot de passe administrateur (le cas échéant). Types de fichiers acceptés : .QBB ou .QBW.')}
          </li>
          ${getAccessStep(inboxKey, inbox, 'fr')}
          <li>S'il y a des données actuellement dans QBE, nous ne pouvons pas migrer dans ce fichier et vous demanderons l'accès à un compte QBE vide. Abstenez-vous de saisir de nouvelles données ou de connecter des flux bancaires ou des applications tierces dans QBE jusqu&#39;à ce que vous receviez mon courriel de fin de migration.</li>
          <li>Veuillez consulter la liste des limitations pour les migrations QB Desktop : <a href="https://quickbooks.intuit.com/learn-support/fr-ca/help-article/import-or-export-files/a-quoi-attendre-lorsque-passez-quickbooks-bureau-a/L0dEyNosU_CA_fr_CA?uid=lsc6ho7j">https://quickbooks.intuit.com/learn-support/fr-ca/help-article/import-or-export-files/a-quoi-attendre-lorsque-passez-quickbooks-bureau-a/L0dEyNosU_CA_fr_CA</a></li>
        </ol>
        <h4>LIMITATIONS CLÉS :</h4>
        <p><strong>Vérifiez votre taille cible</strong><br>
        Dans QuickBooks Desktop, appuyez sur F2 pour ouvrir la fenêtre d'information sur le produit. Le nombre total de cibles est affiché dans la section Informations sur le fichier. Il ne peut pas dépasser <strong>1,5 million de cibles</strong>. Si la taille cible est supérieure, une autre méthode de migration devra être envisagée.</p>
        <p><strong>Budgets</strong><br>
        Seuls les types de budgets de profits et pertes migreront vers QuickBooks en ligne.</p>
        <p><strong>Inventaire</strong><br>
        Desktop utilise le Coût Moyen pour évaluer l'inventaire, tandis que QBE utilise le PEPS (Premier Entré, Premier Sorti).<br>
        <strong>Important :</strong> Nous devons choisir une date pour passer au PEPS, ce qui empêchera les ajustements ou les modifications de l'inventaire avant cette date. Par défaut, nous choisirons le premier jour du mois précédent, sauf indication contraire.</p>
        <p><strong>Paie</strong><br>
        Seules certaines informations de base sur les employés migreront, mais le module de paie devra être configuré après la migration. Les chèques de paie seront copiés comme des chèques ordinaires.</p>
        <p><strong>Clients et travaux</strong><br>
        Les travaux sont transférés dans QBE en tant que sous-clients. Si vous faites le suivi du coût des travaux dans Desktop, vous devrez changer les sous-clients en projets dans QBE.</p>
        <p><strong>Multidevise</strong><br>
        Les transactions comportant <strong>3 devises différentes ou plus</strong> ne migreront pas vers QBE.</p>
        <p>Pour une liste complète des limitations, veuillez consulter : <a href="https://quickbooks.intuit.com/learn-support/fr-ca/help-article/import-or-export-files/migrer-quickbooks-desktop-vers-quickbooks-ligne/L47H2Uugp_CA_fr_CA?uid=lmza7vzr">Migrer de QuickBooks Desktop vers QuickBooks en ligne avec l'outil interne d'Intuit</a></p>`,
    },

        <p><strong>Step 2</strong> &#8211; Open your Bank Reconciliation screen in QBO for that same account. Enter the date immediately before the &#8220;Statement Start Date&#8221; from Sage as the closing date, then enter the opening balance from Sage as the Ending Balance in QBO and begin reconciling.</p>
        <p><strong>Step 3</strong> &#8211; Select all transactions shown in the QBO bank reconciliation screen.</p>
        <p><strong>Step 4</strong> &#8211; Click the filter icon and look for any transaction that is currently outstanding in Sage and appears in the current reconciliation period. Uncheck that transaction to exclude it. Any transaction showing as Reversed or Adjustment in Sage can be ignored.</p>
        <p><strong>Step 5</strong> &#8211; Once all outstanding transactions have been unchecked, your balance will be $0.00 and you can click Finish Reconciliation.</p>
        <p><strong>Step 6</strong> &#8211; Repeat this process for any other bank accounts or credit cards you need to reconcile.</p>
        <p>Please note: since we only brought in the current and previous year&#39;s data, any outstanding transactions older than that will need to be created manually in QBO before they can be reconciled.</p>

  function renderPreview() {
    const wrap = document.getElementById('previewWrap');
    const header = document.getElementById('contentHeader');

    if (!currentTemplate) {
      wrap.innerHTML = `<div class="empty-state"><div class="empty-icon">✉</div><div>Choose a template from the left.</div></div>`;
      header.style.display = 'none';
      return;
    }

    if (PRE_MIGRATION_TEMPLATES.includes(currentTemplate) && !currentInbox) {
      wrap.innerHTML = `<div class="inbox-required"><div class="arrow">↙</div><div>Select your sending inbox below to preview this template.</div></div>`;
      header.style.display = 'none';
      return;
    }

    header.style.display = 'flex';
    const tmpl = TEMPLATES[currentTemplate];
    document.getElementById('templateTitle').textContent = tmpl.title + (currentLang === 'fr' ? ' (FR)' : ' (EN)');

    const inboxEmail = getInboxEmail();
    const uploadLink = getUploadLink();
    const clientEmail = getClientEmail();
    const highVolume = document.getElementById('highVolume').checked;
    const frSpeaker = currentLang === 'fr' && !document.getElementById('frSpeaker').checked;
    const sdChecked = document.getElementById('sharedDocs').checked;
    const sdMode = sdChecked ? (document.getElementById('sdReplace').checked ? 'replace' : 'alternative') : 'none';
    const pairs = getLinkPairs();
    const clientEmailVal = document.getElementById('clientEmail') ? document.getElementById('clientEmail').value.trim() : '';
    const bodyHtml = tmpl[currentLang](inboxEmail, uploadLink, highVolume, frSpeaker, clientEmail, sdMode, pairs, clientEmailVal, currentInbox);

    wrap.innerHTML = `<div class="email-preview">${bodyHtml}</div>`;
  }

  function copyTemplate() {
    const wrap = document.getElementById('previewWrap');
    const preview = wrap.querySelector('.email-preview');
    if (!preview) return;

    const inboxEmailPlain = getInboxEmailPlain();
    const uploadLinkPlain = getUploadLinkPlain();
    const tmpl = TEMPLATES[currentTemplate];
    const clientEmailPlain = getClientEmailPlain();
    const highVolume = document.getElementById('highVolume').checked;
    const frSpeaker = currentLang === 'fr' && !document.getElementById('frSpeaker').checked;
    const sdChecked = document.getElementById('sharedDocs').checked;
    const sdMode = sdChecked ? (document.getElementById('sdReplace').checked ? 'replace' : 'alternative') : 'none';
    const pairs = getLinkPairs();
    const clientEmailVal = document.getElementById('clientEmail') ? document.getElementById('clientEmail').value.trim() : '';
    const clientEmailFormatted = clientEmailVal ? `<span style="color:#0077c5;font-weight:600">${clientEmailVal}</span>` : '';
    const bodyHtml = tmpl[currentLang](`<span style="color:#0077c5;font-weight:600">${inboxEmailPlain}</span>`, `<a href="${uploadLinkPlain}">${uploadLinkPlain}</a>`, highVolume, frSpeaker, `<span style="color:#0077c5;font-weight:600">${clientEmailPlain}</span>`, sdMode, pairs, clientEmailFormatted, currentInbox);

    const fullHtml = `<div style="font-family:Calibri,Segoe UI,sans-serif;font-size:14px;line-height:1.6">${bodyHtml}</div>`;

    try {
      const blob = new Blob([fullHtml], { type: 'text/html' });
      const item = new ClipboardItem({ 'text/html': blob });
      navigator.clipboard.write([item]).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.classList.add('copied');
        btn.innerHTML = '<span>✓</span> Copied!';
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = '<span>⧉</span> Copy';
        }, 2000);
      });
    } catch(e) {
      // Fallback
      const el = document.getElementById('copySource');
      el.innerHTML = fullHtml;
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      document.execCommand('copy');
      sel.removeAllRanges();
    }
  }

  // Init
  document.getElementById('highVolume').checked = true;
  renderPreview();

  function toggleTheme() {
    const root = document.documentElement;
    const btn = document.getElementById('themeToggle');
    if (root.classList.contains('light')) {
      root.classList.remove('light');
      btn.textContent = '☀ Light';
    } else {
      root.classList.add('light');
      btn.textContent = '☾ Dark';
    }
  }
</script>
</body>
</html>
